<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: "Source Sans Pro", sans-serif;
      background: transparent;
    }
    #pick-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      border: 1px solid rgba(250, 250, 250, 0.2);
      background: rgba(250, 250, 250, 0.05);
      color: inherit;
      cursor: pointer;
      font-size: 0.9rem;
    }
    #pick-button:hover {
      border-color: rgba(250, 250, 250, 0.4);
      background: rgba(250, 250, 250, 0.1);
    }
    #status {
      margin-top: 6px;
      font-size: 0.8rem;
      color: #aaa;
      min-height: 1em;
    }
    #status.error {
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <button id="pick-button" type="button">📁 Import PDF from Google Drive</button>
  <div id="status"></div>

  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>

  <script>
    // ---------------------------------------------------------------
    // Minimal Streamlit component protocol (hand-rolled, no build step)
    // ---------------------------------------------------------------
    let componentArgs = {};

    function sendValue(value) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setComponentValue", value: value },
        "*"
      );
    }

    function setFrameHeight(height) {
      window.parent.postMessage(
        { isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: height },
        "*"
      );
    }

    window.addEventListener("message", (event) => {
      if (!event.data || event.data.type !== "streamlit:render") return;
      componentArgs = event.data.args || {};
    });

    // Tell Streamlit we're ready to receive args/render
    window.parent.postMessage(
      { isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1 },
      "*"
    );
    setFrameHeight(64);

    // ---------------------------------------------------------------
    // Google Picker + Drive download
    // ---------------------------------------------------------------
    const SCOPES = "https://www.googleapis.com/auth/drive.readonly";

    let tokenClient = null;
    let accessToken = null;
    let gapiReady = false;
    let gisReady = false;

    const statusEl = document.getElementById("status");

    function setStatus(text, isError) {
      statusEl.textContent = text || "";
      statusEl.className = isError ? "error" : "";
    }

    function gapiLoaded() {
      gapi.load("picker", () => {
        gapiReady = true;
      });
    }

    function gisLoaded() {
      gisReady = true;
    }

    function ensureTokenClient() {
      if (tokenClient) return;

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: componentArgs.client_id,
        scope: SCOPES,
        callback: "", // assigned per-request below
      });
    }

    document.getElementById("pick-button").addEventListener("click", () => {
      if (!componentArgs.client_id || !componentArgs.api_key) {
        setStatus(
          "Google Drive import isn't configured (missing client ID / API key).",
          true
        );
        return;
      }

      if (!gapiReady || !gisReady) {
        setStatus("Still loading Google's libraries, try again in a moment...", false);
        return;
      }

      ensureTokenClient();

      tokenClient.callback = (response) => {
        if (response.error) {
          setStatus("Google sign-in failed: " + response.error, true);
          return;
        }
        accessToken = response.access_token;
        openPicker();
      };

      tokenClient.requestAccessToken({ prompt: accessToken ? "" : "consent" });
    });

    function openPicker() {
      setStatus("");

      const view = new google.picker.DocsView(google.picker.ViewId.DOCS)
        .setMimeTypes("application/pdf")
        .setIncludeFolders(true)
        .setSelectFolderEnabled(false);

      const picker = new google.picker.PickerBuilder()
        .addView(view)
        .setOAuthToken(accessToken)
        .setDeveloperKey(componentArgs.api_key)
        .setCallback(onPicked)
        .build();

      picker.setVisible(true);
    }

    async function onPicked(data) {
      if (data.action !== google.picker.Action.PICKED) return;

      const file = data.docs[0];
      setStatus("Downloading \"" + file.name + "\"...");

      try {
        const response = await fetch(
          "https://www.googleapis.com/drive/v3/files/" + file.id + "?alt=media",
          { headers: { Authorization: "Bearer " + accessToken } }
        );

        if (!response.ok) {
          throw new Error("Drive returned HTTP " + response.status);
        }

        const arrayBuffer = await response.arrayBuffer();
        const bytes = new Uint8Array(arrayBuffer);

        // Encode to base64 in chunks -- doing this in one shot on a
        // large file can blow the call stack with String.fromCharCode.
        let binary = "";
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        const base64Data = btoa(binary);

        setStatus("\"" + file.name + "\" ready.");
        sendValue({ name: file.name, data: base64Data });

      } catch (error) {
        setStatus("Download failed: " + error.message, true);
      }
    }

    gapiLoaded();
    gisLoaded();
  </script>
</body>
</html>
